name: Sincronización Diaria Cierre de Caja

on:
  schedule:
    # Se ejecuta todos los días a las 23:00 UTC (ajustar si prefieres otra hora)
    - cron: '0 23 * * *'
  workflow_dispatch: # Permite ejecutar la tarea manualmente en cualquier momento

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl requests supabase

    - name: Ejecutar script de sincronización
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python sync_corte.py
